<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSC — Answer Skeletons</title>
<style>
:root{
  color-scheme:light;
  --paper:#EDEFEA; --sheet:#FBFCFA; --ink:#16202E; --ink2:#5C6875; --ink3:#8B95A0;
  --rule:#D8DDD6; --margin:#A8483C; --marker:#F5D76E; --accent:#1F5E55;
  /* a lift off the page for hovered and being-edited rows, and the text that has
     to stay legible on a highlighter — both were hardcoded white and near-black,
     which only works while the page is pale */
  --lift:rgba(255,255,255,.6); --lift2:rgba(255,255,255,.55); --onmarker:#16202E;
  --scrim:rgba(22,32,46,.42); --drop:rgba(0,0,0,.09);
  --display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
/* Dark is the same design at a different luminance, not a second stylesheet:
   only the eight colours move. Teal and rust have to come up to stay legible
   against a dark page; the highlighter stays a highlighter, so the text on it
   stays dark in both themes. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11151A; --sheet:#191E25; --ink:#E7ECEF; --ink2:#A7B2BC; --ink3:#78838E;
  --rule:#2B323B; --margin:#D9776A; --marker:#C9A227; --accent:#5CBBA9;
  --lift:rgba(255,255,255,.045); --lift2:rgba(255,255,255,.05);
  --scrim:rgba(0,0,0,.6); --drop:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

.masthead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:30}
.wordmark{font-family:var(--display);font-size:19px}
.wordmark em{font-style:normal;color:var(--ink3)}
.masthead .spacer{flex:1}
button.tool{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink2);padding:5px 9px;border-radius:2px;cursor:pointer}
button.tool:hover{border-color:var(--accent);color:var(--accent)}
button.tool:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;grid-template-columns:288px minmax(0,1fr)}
.nav{border-right:1px solid var(--rule);padding:14px 12px 60px;position:sticky;top:51px;max-height:calc(100vh - 51px);overflow:auto}
.search{width:100%;font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet);color:var(--ink);margin-bottom:10px;font-family:var(--body)}
.papers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:10px;padding:3px 8px;border:1px solid var(--rule);border-radius:99px;cursor:pointer;color:var(--ink2);background:none}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

.tree details{margin-bottom:1px}
.tree summary{cursor:pointer;list-style:none;padding:4px 4px;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:baseline;border-radius:2px}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--lift);color:var(--ink)}
.tree .caret{font-family:var(--mono);font-size:9px;color:var(--ink3);width:9px}
.tree .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.tree .paper>summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-top:8px}
.tree .topic{margin-left:9px}
.tree .sub{margin-left:9px}
.qbtn{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:5px 6px 5px 10px;margin-left:18px;border-left:2px solid transparent;color:var(--ink2);font-size:12px;line-height:1.35}
.qbtn:hover{color:var(--ink);background:var(--lift)}
.qbtn[aria-current="true"]{border-left-color:var(--margin);color:var(--ink);background:var(--sheet)}
.empty{color:var(--ink3);font-size:12.5px;padding:10px 4px}

.sheet{background:var(--sheet);min-height:calc(100vh - 51px);padding:28px 32px 90px 42px;position:relative}
.sheet::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:1px;background:var(--margin);opacity:.35}
.qmeta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:19px;line-height:1.45;margin:0 0 12px;max-width:74ch}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
.tagpill{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:2px 7px;border:1px solid var(--rule);border-radius:99px;color:var(--ink2)}
.decode{max-width:74ch;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin-bottom:20px}
.decode dl{display:grid;grid-template-columns:108px minmax(0,1fr);gap:5px 14px;margin:0}
.decode dt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding-top:3px}
.decode dd{margin:0;font-size:13.5px}
.revealbar{display:flex;gap:8px;margin-bottom:14px;max-width:80ch}
.revealbar .spacer{flex:1}

.block{border-bottom:1px solid var(--rule);max-width:80ch}
.block:first-of-type{border-top:1px solid var(--rule)}
.block>summary{list-style:none;cursor:pointer;padding:13px 26px 13px 0;position:relative;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.block>summary::-webkit-details-marker{display:none}
.block>summary::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:15px;color:var(--ink3)}
.block[open]>summary::after{content:"\2212"}
.block>summary:hover .btitle{color:var(--accent)}
.bnum{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em;min-width:20px}
.btitle{font-family:var(--display);font-size:16px;line-height:1.3}
.bcount{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:auto;padding-left:10px}
.bbody{padding:2px 0 20px 32px}
.fwline{font-size:13px;color:var(--ink2);margin:0 0 12px;font-style:italic}
.fwchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.fwchip{font-family:var(--mono);font-size:10px;letter-spacing:.03em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink2);padding:4px 8px;border-radius:2px;cursor:pointer;white-space:normal;text-align:left}
.fwchip:hover{border-color:var(--accent);color:var(--accent)}
.fwchip.active{background:var(--marker);border-color:var(--marker);color:var(--onmarker);opacity:.95}
.fwpane[hidden]{display:none}
.qcase summary{cursor:pointer;list-style:none}
.qcase summary::-webkit-details-marker{display:none}
.qcase summary::after{content:" — read the full case ▸";font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink3);text-transform:none}
.qcase[open] summary::after{content:""}
.qcase[open] summary{display:block;margin-bottom:6px;color:var(--ink3);font-size:13px;font-family:var(--body);font-style:italic}
.qcase p.full{margin:0}
.bbody ul{margin:0 0 14px;padding-left:17px}
.bbody li{margin-bottom:6px}
.bbody li::marker{color:var(--ink3)}
.sublabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 5px}
.off{border-left:2px solid var(--marker);padding-left:11px;margin:0 0 14px}
/* substantiation carried by a point: the keyword to deploy, the evidence to
   anchor it, and on GS4 the theory it rests on. Muted enough that the stem
   still reads as the point. */
.plist .pkw{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--accent);white-space:nowrap}
.plist .pkw::before{content:"‹"}
.plist .pkw::after{content:"›"}
.plist .pev{font-size:12.5px;color:var(--ink2);font-style:italic}
.plist .peth{font-size:12.5px;color:var(--margin);font-style:italic}
.psub{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:-2px 0 8px 14px}
.psub .plab{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.off p{margin:0;font-size:14px}
.va{font-size:13px;color:var(--ink2)}
.opt{margin:0 0 13px}
.opt .otype{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}
.opt p{margin:0}
pre.diagram{font-family:var(--mono);font-size:11.5px;line-height:1.35;background:var(--paper);border:1px solid var(--rule);padding:14px;overflow:auto;margin:0 0 8px}
.caption{font-size:12.5px;color:var(--ink2);font-style:italic;margin:0}

dialog{border:1px solid var(--ink);border-radius:3px;padding:0;max-width:660px;width:94vw;background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
.dlg{padding:20px}
.dlg h3{font-family:var(--display);font-size:18px;margin:0 0 6px}
.dlg p.hint{font-size:13px;color:var(--ink2);margin:0 0 12px}
.dlg textarea{width:100%;height:220px;font-family:var(--mono);font-size:11.5px;line-height:1.45;padding:10px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink);resize:vertical}
.dlgrow{display:flex;gap:8px;align-items:center;margin-top:12px}
.dlgrow .spacer{flex:1}
.msg{font-size:12.5px;color:var(--margin);min-height:18px;margin-top:8px}
.msg.ok{color:var(--accent)}
.cats{max-height:52vh;overflow:auto;border-top:1px solid var(--rule)}
.catrow{display:grid;grid-template-columns:52px 1fr 1fr 40px;gap:7px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule)}
.catrow .pp{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.08em}
.catrow input{font-size:12.5px;padding:4px 6px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink);width:100%;font-family:var(--body)}
.catrow .n{font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:right}

.drop{position:fixed;inset:0;background:rgba(31,94,85,.12);border:3px dashed var(--accent);z-index:60;display:none;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.drop.on{display:flex}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-size:13px;padding:9px 16px;border-radius:3px;z-index:70;opacity:0;transition:opacity .18s}
/* generation runs detached from the dialog, so its progress needs somewhere to
   live that is not the dialog */
.genstrip{position:fixed;left:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:6px;width:340px;max-width:calc(100vw - 32px)}
.genjob{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:3px;padding:8px 10px;box-shadow:0 2px 12px var(--drop);font-size:12px;color:var(--ink2)}
.genjob.done{border-left-color:#3f7d4f}
.genjob.err{border-left-color:#b4453a}
.genjob.cancelled{border-left-color:var(--ink3)}
.genjob .gj1{display:flex;gap:8px;align-items:baseline}
.genjob .gjm{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink)}
.genjob .gjs{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3);white-space:nowrap}
.genjob .gjq{display:block;margin-top:3px;color:var(--ink3);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.genjob .gjw{display:block;margin-top:4px;color:var(--ink2);line-height:1.4}
.genjob .gjb{margin-top:6px;text-align:right}
.genjob .gjb button{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;background:none;border:1px solid var(--rule);border-radius:2px;color:var(--ink2);cursor:pointer;padding:2px 7px;margin-left:5px}
.genjob .gjb button:hover{border-color:var(--accent);color:var(--accent)}
.toast.on{opacity:1}

@media (max-width:860px){
  main{grid-template-columns:1fr}
  .nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
  .sheet{padding:22px 16px 70px 26px}
  .sheet::before{left:12px}
  .decode dl{grid-template-columns:1fr;gap:2px}
  .decode dt{padding-top:8px}
  .catrow{grid-template-columns:1fr;gap:3px}
}
.ef{margin-bottom:14px;max-width:74ch}
.ef>label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.erow{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.erow>.etext,.erow>.inlineedit{flex:1;min-width:0}
.xbtn,.mvbtn{font-family:var(--mono);background:none;border:1px solid var(--rule);color:var(--ink2);border-radius:2px;cursor:pointer;font-size:11px;padding:4px 8px;flex:0 0 auto}
.xbtn:hover{border-color:var(--margin);color:var(--margin)}
.xbtn.danger{border-color:var(--margin);color:var(--margin)}
.mvbtn:hover{border-color:var(--accent);color:var(--accent)}
.mvbtn:disabled{opacity:.3;cursor:default}
.addbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;background:none;border:0;color:var(--ink3);cursor:pointer;padding:3px 0;margin-top:2px}
.addbtn:hover{color:var(--accent);text-decoration:underline}
.ph{color:var(--ink3);font-style:italic}
.etext{cursor:text;border-bottom:1px dashed transparent}
.etext:hover{border-bottom-color:var(--accent)}
.etext.eblock{display:block}
.inlineedit{width:100%;font:inherit;padding:4px 6px;border:1px solid var(--accent);border-radius:2px;background:var(--sheet);color:var(--ink)}
textarea.inlineedit{resize:vertical;min-height:52px;line-height:1.5;display:block}
.inlineedit.mono{font-family:var(--mono);font-size:12px}
.confirmdel{font-size:12px;color:var(--margin);display:inline-flex;gap:6px;align-items:center}
.secctl{display:flex;gap:6px;margin-bottom:10px}
.pencil{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink3);border-radius:2px;cursor:pointer;padding:2px 7px;margin-left:10px;opacity:0;transition:opacity .12s}
.block>summary:hover .pencil,.pencil:focus-visible{opacity:1}
.pencil:hover{border-color:var(--accent);color:var(--accent)}
.pencil.on{opacity:1;border-color:var(--accent);color:var(--accent)}
.pencil.zp{opacity:1;margin-left:0}
.block.editing{background:var(--lift2);box-shadow:inset 2px 0 0 var(--accent)}
.zone.editing{background:var(--lift2);box-shadow:inset 2px 0 0 var(--accent);padding:10px 12px 2px;margin:0 -12px 4px}
.zonebar{display:flex;justify-content:flex-end;margin-bottom:6px}
.ro{white-space:pre-wrap}
.ro.mono{font-family:var(--mono);font-size:11.5px}
.vwarn{max-width:74ch;border-left:2px solid var(--margin);background:rgba(168,72,60,.07);padding:8px 11px;margin:0 0 16px;font-size:12.5px;color:var(--margin)}
.decode dd ul{margin:0;padding-left:16px}
.decode dd li{margin-bottom:2px}
.fwname{margin:0 0 6px}
.fwname mark{background:var(--marker);font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;color:var(--onmarker)}
.off ul,.va ul{margin:0;padding-left:15px}
.va li{font-size:13px;color:var(--ink2)}

/* view toggle + answer picker */
.viewbar{display:flex;gap:0;margin:2px 0 18px;border-bottom:1px solid var(--rule);max-width:80ch}
.viewtab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.viewtab:hover{color:var(--ink)}
.viewtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--margin)}
.viewtab .n{font-size:9.5px;color:var(--ink3);margin-left:5px}
.ansbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 16px}
.anschip{font-family:var(--mono);font-size:10px;padding:4px 9px;border:1px solid var(--rule);border-radius:2px;background:none;color:var(--ink2);cursor:pointer}
.anschip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ansmeta{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-left:auto}
.blank{border:1px dashed var(--rule);border-radius:3px;padding:26px 20px;text-align:center;max-width:80ch;color:var(--ink3)}
.blank p{margin:0 0 12px;font-size:13.5px}
.blank .tool{margin:0 4px}

/* my answer — always-editable, borderless until touched, collapsible per block */
.mine{max-width:74ch}
.mineblk{border-bottom:1px solid var(--rule)}
.mineblk:first-of-type{border-top:1px solid var(--rule)}
.mineblk>summary{list-style:none;cursor:pointer;padding:11px 24px 11px 0;position:relative;display:flex;gap:8px;align-items:center}
.mineblk>summary::-webkit-details-marker{display:none}
.mineblk>summary::after{content:"+";position:absolute;right:2px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:15px;color:var(--ink3)}
.mineblk[open]>summary::after{content:"\2212"}
.mineblk>summary:hover .minehead,.mineblk>summary:hover .mtitle{color:var(--accent)}
.minehead{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0}
/* the sub-heading reads as text in the summary so the whole row folds; the field
   that edits it lives in the body, where there is room to click into it */
.mtitle{flex:1;min-width:0;font-family:var(--display);font-size:16px;line-height:1.3}
.mbody{padding:0 0 16px}
.mheadrow{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.mheadrow label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.mheadrow input{flex:1;min-width:0;font-family:var(--display);font-size:15px;border:0;border-bottom:1px dashed var(--rule);background:none;color:var(--ink);padding:3px 0}
.mheadrow input:focus{outline:none;border-bottom-color:var(--accent)}
/* contenteditable, not textarea: a textarea wraps every line flush left, so the
   second line of a long bullet lands under the bullet instead of under its text.
   Hanging indent needs one block element per line, which only this gives. */
.minebox{position:relative;width:100%;font-family:var(--body);font-size:14.5px;line-height:1.66;border:1px solid transparent;border-radius:2px;background:none;color:var(--ink);padding:6px 8px;min-height:2.6em;white-space:pre-wrap;overflow-wrap:break-word;cursor:text}
.minebox:hover{border-color:var(--rule)}
.minebox:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.minebox .ml{min-height:1.66em}
.minebox.mbempty::before{content:attr(data-ph);position:absolute;left:8px;top:6px;color:var(--ink3);font-style:italic;pointer-events:none}
.minehint{font-size:11.5px;color:var(--ink3);margin:14px 0 0;font-style:italic}

/* home */
.home{max-width:104ch}
.homehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.homehead h2{font-family:var(--display);font-size:22px;margin:0}
.homehead .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.grouptog{display:flex;gap:4px;margin-left:auto}
.paperblk{margin-bottom:26px}
.paperblk>h3{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:6px;margin:0 0 10px}
.topicname{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:12px 0 6px}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.themecard{text-align:left;background:none;border:1px solid var(--rule);border-radius:3px;padding:9px 11px;cursor:pointer;display:flex;align-items:baseline;gap:8px}
.themecard:hover{border-color:var(--accent)}
.themecard.open{border-color:var(--margin);background:var(--paper)}
.themecard .tn{font-size:13px;color:var(--ink);line-height:1.3}
.themecard .tc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.qlist{margin:8px 0 4px;padding:8px 0 8px 12px;border-left:2px solid var(--margin)}
.qlist button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:5px 4px;color:var(--ink2);font-size:13px;line-height:1.4}
.qlist button:hover{color:var(--ink);background:var(--lift)}
.qlist .yr{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-right:8px}
.badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:1px 6px;color:var(--ink3);margin-left:6px}
.badge.pyq{border-color:var(--accent);color:var(--accent)}
.badge.done{border-color:var(--margin);color:var(--margin)}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.filters .chip{font-size:9.5px;padding:3px 7px}
.homepapers{margin:0 0 16px}
.homepapers .chip{font-size:10px;padding:3px 9px}
.chipn{margin-left:5px;opacity:.6}
.collide{font-size:12.5px;color:var(--margin);margin:8px 0 0}
.collide ul{margin:4px 0 0;padding-left:17px}
.ncmap{margin:7px 0 0;display:flex;flex-direction:column;gap:5px}
.ncrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ncwas{font-family:var(--mono);font-size:11px;color:var(--ink2);flex:1;min-width:170px}
.ncrow select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet);color:var(--ink)}
.genrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.genrow label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);width:76px;flex:none}
.genrow select,.genrow input{flex:1;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet);color:var(--ink)}
.newform{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 12px;align-items:center}
.newform label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.newform select,.newform textarea{width:100%;font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet);color:var(--ink)}
.newform textarea{min-height:150px;resize:vertical;line-height:1.5}
.newform .qfield{align-self:start;padding-top:8px}
.usemeter{font-size:11.5px;color:var(--ink2);margin-top:8px}
.usehead{font-size:11.5px;color:var(--ink2);margin:6px 0 4px}
.usetab{border:1px solid var(--rule);border-radius:2px;max-height:110px;overflow:auto}
.userow{display:flex;align-items:baseline;gap:8px;padding:3px 8px;border-bottom:1px solid var(--rule)}
.userow:last-child{border-bottom:none}
.orused{font-family:var(--mono);font-size:10px;color:var(--ink3);width:74px;text-align:right;flex:none}
.orlist{max-height:190px;overflow:auto;border:1px solid var(--rule);border-radius:2px;margin:0 0 10px}
.orrow{display:flex;align-items:baseline;gap:8px;padding:4px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--rule)}
.orrow:last-child{border-bottom:none}
.orrow:hover{background:var(--paper)}
.orrow.on{background:var(--marker)}
.orrow.on .orid,.orrow.on .orused,.orrow.on .orcost,.orrow.on .orctx{color:var(--onmarker)}
.orid{flex:1;font-family:var(--mono);font-size:11px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orcost{font-family:var(--mono);font-size:10.5px;color:var(--accent);width:56px;text-align:right;flex:none}
.orctx{font-family:var(--mono);font-size:10px;color:var(--ink3);width:38px;text-align:right;flex:none}
.frow{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.flab{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);width:58px;flex:none}
.ppick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ppick .chip{font-size:10.5px;padding:4px 9px}
.dangerzone{margin:24px 0 40px;padding-top:14px;border-top:1px solid var(--rule);max-width:74ch}
.csband{margin:10px 0 2px 9px;padding-top:7px;border-top:1px dashed var(--margin);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--margin)}
.src{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.src.warn{color:var(--margin)}
.ghform{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;align-items:center;margin-bottom:6px}
.ghform label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ghform input{font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink);width:100%;font-family:var(--body)}
.ghnote{font-size:12.5px;color:var(--ink2);margin:10px 0 0;line-height:1.5}
.ghnote code{font-family:var(--mono);font-size:11.5px;background:var(--paper);padding:1px 4px;border-radius:2px}
.ghfiles{font-family:var(--mono);font-size:11px;color:var(--ink2);margin:10px 0 0;line-height:1.7}
@media print{:root[data-theme="dark"]{--paper:#fff;--sheet:#fff;--ink:#16202E;--ink2:#5C6875;--ink3:#8B95A0;--rule:#D8DDD6;--margin:#A8483C;--marker:#F5D76E;--accent:#1F5E55;--lift:transparent;--lift2:transparent;--onmarker:#16202E}.masthead,.nav,.revealbar,.tagrow,.pencil,.zonebar,.secctl,.dangerzone,.addbtn,.xbtn,.mvbtn{display:none}main{grid-template-columns:1fr}.sheet{background:#fff}.block>summary::after{display:none}.block.editing,.zone.editing{background:none;box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* Runs before first paint so a dark-mode reader is never flashed a white page.
   The masthead toggle writes the same key; with nothing stored we follow the OS. */
(function(){
  var t=null; try{ t=localStorage.getItem("upsc-theme"); }catch(e){}
  if(t!=="light"&&t!=="dark")
    t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  document.documentElement.setAttribute("data-theme",t);
})();
</script>

<script>
(function(){
"use strict";
/* Browser storage is scoped to the ORIGIN, not the path — on user.github.io every Pages
   project of yours shares one namespace. Without this suffix a second project would collide
   with this bank's draft and, worse, with its GitHub token. */
var SCOPE=location.pathname.replace(/\/index\.html$/,"").replace(/\/+$/,"");
var KEY="upsc-skeleton-bank-v1"+SCOPE;
var LEGACY_KEY="upsc-skeleton-bank-v1";
var PAPERS=["Essay","GS1","GS2","GS3","GS4"];
var CS="Case Studies";
var CASE_TYPE="Case study";
var TYPES=["Theory/Concept","Quote-based","Case study","Essay"];
var FILES={"Essay":"essay.json","GS1":"gs1.json","GS2":"gs2.json","GS3":"gs3.json"};

var GHKEY="upsc-github-config"+SCOPE;
/* Local storage is a DRAFT BUFFER, not a second source of truth. It carries a `dirty` flag:
   only a dirty draft is allowed to override what came from the repo. A clean one is discarded
   on load, so a stale browser copy can never silently shadow the committed files. */
var store={
  read:async function(){
    try{
      var raw;
      if(window.storage&&window.storage.get){var r=await window.storage.get(KEY);raw=r&&r.value;}
      else raw=localStorage.getItem(KEY);
      // one-time migration: adopt an unsaved draft written before the key was scoped
      if(!raw&&KEY!==LEGACY_KEY){
        var old=localStorage.getItem(LEGACY_KEY);
        if(old){var po=JSON.parse(old);if(po&&(po.dirty||po.questions)) raw=old;}
      }
      if(!raw) return null;
      var o=JSON.parse(raw);
      if(o&&o.questions) return {dirty:true,db:o};      // legacy shape: assume unsaved
      return o;
    }catch(e){return null;}
  },
  write:async function(d,dirty){
    var s=JSON.stringify({dirty:!!dirty,savedAt:new Date().toISOString(),db:d});
    try{
      if(window.storage&&window.storage.set){await window.storage.set(KEY,s);return true;}
      localStorage.setItem(KEY,s);return true;
    }catch(e){return false;}
  }
};
var ghCfg={owner:"",repo:"",branch:"main",token:""};
function ghLoad(){try{var r=localStorage.getItem(GHKEY);if(r)ghCfg=JSON.parse(r);}catch(e){}}

/* -------- search -------- */
function haystack(q){
  var s=[q.question,q.type,q.paper,q.source,(q.notes||""),(q.summary||"")];
  (q.tags||[]).forEach(function(t){s.push(t.join(" "));});
  var m=q.mine||{};
  s.push(m.intro||"",m.conclusion||"");
  (m.sections||[]).forEach(function(x){s.push(x.heading||"",x.body||"");});
  (q.answers||[]).forEach(function(a){
    s.push(a.model||"",a.diagram||"",a.caption||"");
    var d=a.decode||{};
    s.push(d.directive||"",d.hidden||"",d.limit||"");
    (d.demands||[]).concat(d.concepts||[]).forEach(function(v){s.push(v);});
    var vb=a.vaBank||{};
    ["quotes","keywords","examples","thinkers"].forEach(function(k){(vb[k]||[]).forEach(function(v){s.push(v);});});
    (a.sections||[]).forEach(function(x){
      s.push(x.heading);
      (x.frameworks||[]).forEach(function(fw){
        s.push(fw.name,fw.why);
        (fw.points||[]).forEach(function(p){
          s.push(pointStem(p));
          if(p&&typeof p==="object") s.push(p.keyword||"",p.evidence||"");
        });
      });
      ["off","valueAdd"].forEach(function(k){(x[k]||[]).forEach(function(v){s.push(v);});});
    });
    (a.intros||[]).concat(a.conclusions||[]).forEach(function(o){s.push(o.text);});
    (a.pitfalls||[]).forEach(function(p){s.push(p);});
  });
  return s.join(" ").toLowerCase();
}
function matches(q){
  if(paperFilter!=="All"&&q.paper!==paperFilter) return false;
  if(srcFilter!=="All"&&(q.source||"Test series")!==srcFilter) return false;
  if(mineFilter==="Yes"&&!hasMine(q)) return false;
  if(mineFilter==="No"&&hasMine(q)) return false;
  if(aiFilter==="Yes"&&!hasAI(q)) return false;
  if(aiFilter==="No"&&hasAI(q)) return false;
  if(!query) return true;
  return haystack(q).indexOf(query)>-1;
}

/* -------- nav -------- */
/* The tree is rebuilt from scratch on every render, so open/closed state has to be carried
   across by hand — otherwise clicking a question snaps every branch you expanded shut.
   Read from the live DOM rather than a toggle listener: setting .open fires toggle events of
   its own, and those would overwrite the state we are trying to preserve. */
function captureNav(){
  // if the tree on screen was rendered under a search it is force-expanded, and that is not a
  // user choice — recording it would erase whatever they had actually collapsed
  if(navRenderedWithQuery) return;
  var t=$("tree");if(!t) return;
  t.querySelectorAll("details[data-navkey]").forEach(function(d){
    navOpen[d.getAttribute("data-navkey")]=d.open;
  });
}
function navDetails(cls,key,dflt){
  var d=document.createElement("details");
  d.className=cls;
  d.setAttribute("data-navkey",key);

  d.open=query?true:(navOpen[key]!==undefined?navOpen[key]:!!dflt);
  return d;
}
function hasCurrent(list){
  return !!(current&&list.some(function(q){return q.id===current.id;}));
}

  if(!shown.length){tree.innerHTML='<p class="empty">Nothing matches. Add a question, or clear the search.</p>';navRenderedWithQuery=!!query;return;}

  PAPERS.forEach(function(paper){
    var inPaper=shown.filter(function(q){return q.paper===paper;});
    if(!inPaper.length) return;
    var tax=db.taxonomy[paper]||{};
    var pd=navDetails("paper",paper,(paperFilter===paper)||hasCurrent(inPaper));
    pd.innerHTML='<summary><span class="caret">\u25b8</span>'+esc(paper)+'<span class="cnt">'+inPaper.length+'</span></summary>';

    var placed={},theory=inPaper.filter(function(q){return !isCase(q);}),cases=inPaper.filter(isCase);

    Object.keys(tax).forEach(function(topic){
      if(topic===CS) return;
      var subs=tax[topic]||[];
      var inTopic=theory.filter(function(q){return (q.tags||[]).some(function(t){return t[0]===topic;});});
      if(!inTopic.length) return;
      var td=navDetails("topic",paper+"\u203a"+topic,hasCurrent(inTopic));
      td.innerHTML='<summary><span class="caret">\u25b8</span>'+esc(topic)+'<span class="cnt">'+inTopic.length+'</span></summary>';
      subs.forEach(function(sub){
        var inSub=theory.filter(function(q){return (q.tags||[]).some(function(t){return t[0]===topic&&t[1]===sub;});});
        if(!inSub.length) return;
        var sd=navDetails("sub",paper+"\u203a"+topic+"\u203a"+sub,hasCurrent(inSub));
        sd.innerHTML='<summary><span class="caret">\u25b8</span>'+esc(sub)+'<span class="cnt">'+inSub.length+'</span></summary>';
        inSub.forEach(function(q){placed[q.id]=1;sd.appendChild(qBtn(q));});
        td.appendChild(sd);
      });
      pd.appendChild(td);
    });

    if(cases.length){
      var band=document.createElement("div");band.className="csband";
      band.textContent="Case Studies \u00b7 "+cases.length;pd.appendChild(band);
      (tax[CS]||[]).forEach(function(sub){
        var inSub=cases.filter(function(q){return (q.tags||[]).some(function(t){return t[0]===CS&&t[1]===sub;});});
        if(!inSub.length) return;
        var sd=navDetails("topic",paper+"\u203a"+CS+"\u203a"+sub,hasCurrent(inSub));
        sd.innerHTML='<summary><span class="caret">\u25b8</span>'+esc(sub)+'<span class="cnt">'+inSub.length+'</span></summary>';
        inSub.forEach(function(q){placed[q.id]=1;sd.appendChild(qBtn(q));});
        pd.appendChild(sd);
      });
    }

    var loose=inPaper.filter(function(q){return !placed[q.id];});
    if(loose.length){
      var od=navDetails("topic",paper+"\u203a__unfiled",hasCurrent(loose));
      od.innerHTML='<summary><span class="caret">\u25b8</span>Unfiled<span class="cnt">'+loose.length+'</span></summary>';
      loose.forEach(function(q){od.appendChild(qBtn(q));});

    }
    tree.appendChild(pd);
  });

}
function qBtn(q){

function actionBtn(label,fn,cls,disabled){

/* Points carry substantiation the other lists don't: a keyword to deploy and a
   data/example to anchor the stem, plus an ethical theory on GS4. A point is
   either a bare string (everything written before substantiation) or
   {stem, keyword, evidence, ethic} - both shapes render and edit here. */
function asPoint(arr,i){
  if(!arr[i]||typeof arr[i]!=="object") arr[i]={stem:String(arr[i]==null?"":arr[i])};
  return arr[i];
}
function pointList(arr,ph,gs4){
  if(!EDIT){

    return '<span class="plab">'+key.slice(0,3)+'</span>'+
      etext(function(){var p=arr[i];return (p&&typeof p==="object"&&p[key])||"";},
            function(nv){asPoint(arr,i)[key]=nv;},{placeholder:ph2});

            {placeholder:ph,autoFocus:focus})+
      actionBtn("×",function(){arr.splice(i,1);save();renderSheet();},"xbtn")+'</div>';
    h+='<div class="psub">'+fld(i,"keyword","keyword to deploy")+fld(i,"evidence","data, example or case");
    if(gs4) h+=fld(i,"ethic","ethical theory or thinker");

  }).join('')+actionBtn("+ Add",function(){

  })+'</div>';

function strListInline(arr,ph){

    var items=arr.filter(function(v){return v!=null&&String(v).trim()!=="";});
    if(!items.length) return "";

  }

    return '<div class="erow">'+etext(function(){return arr[i];},function(nv){arr[i]=nv;},{placeholder:ph,autoFocus:focus})+
      actionBtn("×",function(){arr.splice(i,1);save();renderSheet();},"xbtn")+'</div>';
  }).join('')+actionBtn("+ Add",function(){arr.push("");pendingArr=arr;pendingIdx=arr.length-1;save();renderSheet();})+'</div>';

function wireInlineEdits(s){
  s.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick=function(e){
      e.preventDefault();e.stopPropagation();
      var id=b.getAttribute("data-act");
      if(actionRegistry[id]) actionRegistry[id]();
    };
  });
  s.querySelectorAll(".inlineedit").forEach(function(el){
    el.addEventListener("click",function(e){e.stopPropagation();});
    var id=el.getAttribute("data-eid"),entry=fieldRegistry[id];
    if(!entry) return;
    function commit(){entry.set(el.value);editKey=null;save();renderNav();renderSheet();}
    function cancel(){editKey=null;renderSheet();}
    if(el.tagName==="SELECT"){
      el.onchange=commit;
    } else {
      el.addEventListener("blur",commit);
      el.addEventListener("keydown",function(e){
        if(e.key==="Escape"){e.preventDefault();cancel();}
        else if(e.key==="Enter"&&!entry.multiline){e.preventDefault();commit();}
        else if(e.key==="Enter"&&entry.multiline&&(e.metaKey||e.ctrlKey)){e.preventDefault();commit();}
      });
    }
  });
  if(editKey){
    var act=s.querySelector('.inlineedit[data-eid="'+editKey+'"]');
    if(act){
      act.focus();
      if(act.tagName!=="SELECT"&&act.setSelectionRange){var L=act.value.length;act.setSelectionRange(L,L);}
    }
  }
}

/* -------- question shape helpers -------- */
function normalizeQ(q){
  q.source=q.source||"Test series";
  q.tags=q.tags||[];
  q.answers=q.answers||[];
  q.answers.forEach(function(a,i){
    a.id=a.id||("a"+(i+1));
    a.decode=a.decode||{};
    a.decode.demands=a.decode.demands||[];a.decode.concepts=a.decode.concepts||[];
    a.intros=a.intros||[];a.sections=a.sections||a.body||[];delete a.body;
    a.conclusions=a.conclusions||[];a.pitfalls=a.pitfalls||[];
    a.vaBank=a.vaBank||{};
    ["quotes","keywords","examples","thinkers"].forEach(function(k){a.vaBank[k]=a.vaBank[k]||[];});
  });
  q.mine=q.mine||{};
  q.mine.intro=q.mine.intro||"";
  q.mine.conclusion=q.mine.conclusion||"";
  q.mine.sections=q.mine.sections||[];
  return q;
}
function hasAI(q){ return (q.answers||[]).length>0; }
function hasMine(q){
  var m=q.mine||{};
  if((m.intro||"").trim()||(m.conclusion||"").trim()) return true;
  return (m.sections||[]).some(function(s){return (s.heading||"").trim()||(s.body||"").trim();});
}
function isTouched(q){ return hasAI(q)||hasMine(q); }
/* a point may be a bare string or {stem, keyword?, evidence?} — only stem is required */
function isPYQ(q){ return (q.source==="PYQ") || /^pyq-/.test(q.id||""); }
function deleteQuestion(q){
  if(isPYQ(q)){ toast("Past-paper questions cannot be deleted."); return; }
  var i=db.questions.indexOf(q);
  if(i<0) return;
  db.questions.splice(i,1);
  confirmKey=null; current=null; homeMode=true; lastRenderedId=null;
  save(); renderNav(); renderSheet();
  toast("Deleted “"+String(q.question||"untitled").slice(0,44)+"…”");
}
function pointStem(p){ return (p&&typeof p==="object") ? (p.stem||"") : String(p==null?"":p); }
function pointHtml(p){
  if(!p||typeof p!=="object") return esc(String(p==null?"":p));
  var h=esc(p.stem||"");
  if(p.keyword)  h+=' <span class="pkw">'+esc(p.keyword)+'</span>';
  if(p.evidence) h+=' <span class="pev">'+esc(p.evidence)+'</span>';
  if(p.ethic)    h+=' <span class="peth">'+esc(p.ethic)+'</span>';
  return h;
}

/* -------- my answer: always-editable boxes with markdown-ish keys --------
   The stored value stays plain text — one line per line, two spaces per indent
   level, "• " for a bullet. Indent depth lives on the line's data-d rather than
   as literal spaces in the DOM, so the leading whitespace never renders and the
   hanging indent lands where the text starts instead of two characters right of
   it. Anything written before this change still loads: leading spaces are read
   back into data-d, and a leading "- " is rewritten to "• ". */
var mineBoxes={}, saveTimer=null, MB_STEP="  ";
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(function(){save();},500); }
try{ document.execCommand("defaultParagraphSeparator",false,"div"); }catch(e){}

function mbPad(d){ var s=""; for(var i=0;i<d;i++) s+=MB_STEP; return s; }
function mbNorm(v){ return String(v==null?"":v).replace(/\r\n?/g,"\n").replace(/^([ \t]*)[-*] /gm,"$1• "); }
function mbHtml(v){
  return mbNorm(v).split("\n").map(function(l){
    var lead=(l.match(/^[ \t]*/)||[""])[0];
    var d=Math.floor(lead.replace(/\t/g,MB_STEP).length/MB_STEP.length);
    var t=l.slice(lead.length);
    return '<div class="ml" data-d="'+d+'">'+(t?esc(t):"<br>")+'</div>';
  }).join("");
}
function mbText(el){
  var out=[];
  for(var i=0;i<el.childNodes.length;i++){
    var n=el.childNodes[i];
    if(n.nodeType===3) out.push(n.nodeValue.replace(/\n/g,""));
    else if(n.nodeName==="BR") out.push("");
    else if(n.nodeType===1) out.push(mbPad(+(n.getAttribute("data-d")||0))+(n.textContent||""));
  }
  return out.join("\n");
}
function mbLine(el){
  var s=window.getSelection(); if(!s||!s.rangeCount) return null;
  var n=s.getRangeAt(0).startContainer;
  while(n&&n!==el){ if(n.parentNode===el&&n.nodeType===1) return n; n=n.parentNode; }
  return null;
}
function mbSelect(d){
  var r=document.createRange(); r.selectNodeContents(d);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
/* The hanging indent has to equal the rendered width of "• " exactly, or every
   wrapped line sits a few pixels off the text above it. Guessing it was wrong by
   9px in this font, so it is measured — off-document, in the box's own font, and
   cached, since mbPaint runs on every keystroke. */
var mbHang=null;
function mbMarkerEm(el){
  if(mbHang!=null) return mbHang;
  var cs=getComputedStyle(el), fs=parseFloat(cs.fontSize)||16;
  var s=document.createElement("span");
  s.textContent="• ";
  s.style.cssText="position:absolute;left:-9999px;top:0;white-space:pre;visibility:hidden";
  s.style.font=cs.font; s.style.letterSpacing=cs.letterSpacing;
  document.body.appendChild(s);
  mbHang=s.getBoundingClientRect().width/fs;
  document.body.removeChild(s);
  return mbHang;
}
/* Style only — no text or structure is touched, so the caret never moves. */
function mbPaint(el){
  var blank=true, mark=mbMarkerEm(el);
  for(var i=0;i<el.children.length;i++){
    var d=el.children[i], t=d.textContent||"";
    if(t.trim()) blank=false;
    var stray=(t.match(/^[ \t]*/)||[""])[0].replace(/\t/g,MB_STEP).length/MB_STEP.length;
    var depth=(+(d.getAttribute("data-d")||0))+Math.floor(stray);
    var hang=/^[ \t]*•\s/.test(t)?mark:0;
    d.style.paddingLeft=(depth*1.7+hang)+"em";
    d.style.textIndent=hang?("-"+hang+"em"):"";
  }
  el.classList.toggle("mbempty",blank&&!(el.textContent||"").trim());
}
/* A font that arrives after first paint would invalidate the measurement. */
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(function(){
    mbHang=null;
    document.querySelectorAll(".minebox").forEach(mbPaint);
  });
}
function mbKeys(e,el){
  var d=mbLine(el);
  if(e.key==="Tab"){
    e.preventDefault();
    if(!d) return;
    var cur=+(d.getAttribute("data-d")||0);
    d.setAttribute("data-d",String(Math.max(0,Math.min(8,cur+(e.shiftKey?-1:1)))));
    mbPaint(el); el.dispatchEvent(new Event("input",{bubbles:true}));
    return;
  }
  if(e.key==="Enter"&&!e.shiftKey&&d){
    var t=d.textContent||"";
    if(/^\s*•\s*$/.test(t)){                 // empty bullet: leave the list
      e.preventDefault();
      mbSelect(d); document.execCommand("delete");
      el.dispatchEvent(new Event("input",{bubbles:true}));
      return;
    }
    // let the browser split the line (it keeps undo intact), then carry the bullet
    if(/^\s*•\s/.test(t)) el._mbBullet=true;
  }
}
function mbInput(el){
  var kids=el.children, i;
  for(i=0;i<kids.length;i++){                // a line the browser just split off
    if(!kids[i].hasAttribute("data-d")){     // inherits the depth of the one above
      kids[i].className="ml";
      kids[i].setAttribute("data-d",i>0?(kids[i-1].getAttribute("data-d")||"0"):"0");
    }
  }
  if(el._mbBullet){
    el._mbBullet=false;
    var ln=mbLine(el);
    if(ln&&!/^\s*•/.test(ln.textContent||"")) document.execCommand("insertText",false,"• ");
  }
  var cur=mbLine(el), m=cur&&(cur.textContent||"").match(/^([ \t]*)[-*] $/);
  if(m){                                     // "- " on an otherwise empty line becomes a bullet
    mbSelect(cur); document.execCommand("insertText",false,m[1]+"• ");
  }
  mbPaint(el);
}
function mineBox(key,getVal,setVal,ph){
  var id="mb"+key;
  mineBoxes[id]={get:getVal,set:setVal};
  return '<div class="minebox" contenteditable="true" spellcheck="true" '+
    'data-mb="'+id+'" data-ph="'+esc(ph)+'">'+mbHtml(getVal())+'</div>';
}
function wireMine(s){
  s.querySelectorAll("[data-mb]").forEach(function(el){
    var e=mineBoxes[el.getAttribute("data-mb")];
    if(!e) return;
    mbPaint(el);
    el.addEventListener("input",function(){ mbInput(el); e.set(mbText(el)); scheduleSave(); });
    el.addEventListener("keydown",function(ev){ mbKeys(ev,el); });
    el.addEventListener("paste",function(ev){
      ev.preventDefault();
      var txt=((ev.clipboardData||window.clipboardData).getData("text/plain")||"");
      document.execCommand("insertText",false,mbNorm(txt));
    });
  });
  s.querySelectorAll("[data-mh]").forEach(function(inp){
    var key=inp.getAttribute("data-mh"), e=mineBoxes[key];
    if(!e) return;
    var title=s.querySelector('[data-mt="'+key+'"]');
    inp.addEventListener("input",function(){
      e.set(inp.value);
      if(title){                      // keep the folded label in step as you type
        title.textContent=inp.value||"untitled sub-heading";
        title.classList.toggle("ph",!inp.value);
      }
      scheduleSave();
    });
  });
  s.querySelectorAll(".mineblk").forEach(function(blk){
    var key=blk.getAttribute("data-blockkey");
    if(key) blk.addEventListener("toggle",function(){openBlocks[key]=blk.open;});
  });
}
/* Blocks default open — a fresh question should show the whole sheet, not a row
   of shut drawers. openBlocks only ever records a deliberate fold. */
function mineBlk(key,headHtml,inner){
  var k="mine:"+key;
  return '<details class="mineblk" data-blockkey="'+esc(k)+'"'+(openBlocks[k]===false?"":" open")+'>'+
    '<summary>'+headHtml+'</summary><div class="mbody">'+inner+'</div></details>';
}
function mineView(q){
  // your own answer is always editable - no pencil, no read mode. actionBtn/confirmBtn
  // return nothing while EDIT is false, so this must be set before building any control.
  var wasEdit=EDIT; EDIT=true;
  var m=q.mine, h='<div class="mine">';
  h+=mineBlk("intro",'<span class="minehead">Introduction</span>',
     mineBox("intro",function(){return m.intro;},function(v){m.intro=v;},"your opening — 2-3 lines"));
  m.sections.forEach(function(sec,i){
    mineBoxes["mh"+i]={get:function(){return sec.heading;},set:function(v){sec.heading=v;}};
    h+=mineBlk("s"+i,
       '<span class="mtitle'+(sec.heading?'':' ph')+'" data-mt="mh'+i+'">'+
         esc(sec.heading||"untitled sub-heading")+'</span>'+
       actionBtn("↑",function(){if(i>0){var t=m.sections[i];m.sections[i]=m.sections[i-1];m.sections[i-1]=t;save();renderSheet();}},"mvbtn",i===0)+
       actionBtn("↓",function(){if(i<m.sections.length-1){var t=m.sections[i];m.sections[i]=m.sections[i+1];m.sections[i+1]=t;save();renderSheet();}},"mvbtn",i===m.sections.length-1)+
       confirmBtn("×",function(){m.sections.splice(i,1);save();renderSheet();}),
       '<div class="mheadrow"><label>Sub-heading</label>'+
         '<input data-mh="mh'+i+'" value="'+esc(sec.heading||"")+'" placeholder="name this sub-heading"></div>'+
       mineBox("s"+i,function(){return sec.body;},function(v){sec.body=v;},"your points for this sub-heading"));
  });
  h+='<div style="margin:14px 0">'+actionBtn("+ Add sub-heading",function(){
       m.sections.push({heading:"",body:""});save();renderSheet();
     })+'</div>';
  h+=mineBlk("concl",'<span class="minehead">Conclusion</span>',
     mineBox("concl",function(){return m.conclusion;},function(v){m.conclusion=v;},"your close — 2-3 lines"));
  h+='<p class="minehint">Type “- ” for a bullet. Enter continues the list, Tab indents, Shift-Tab outdents, an empty bullet ends it.</p>';
  EDIT=wasEdit;
  return h+'</div>';
}

/* -------- AI answers view -------- */
function aiView(q){
  var h="";
  sheetPaper=q.paper;          // sectionBlock is top-level; it needs the paper for the GS4 ethics field
  if(!q.answers.length){
    return '<div class="blank"><p>No AI answer stored for this question yet.</p>'+
      '<button class="tool" id="pasteAnsBtn">Paste a skeleton</button>'+
      '<button class="tool" id="copyPromptHere">Copy prompt</button>'+

/* -------- shared validation (used on import, and live in the sheet while editing) --------
   Deliberately reads q.type and q.tags separately rather than going through isCase(),
   because catching the two disagreeing is the whole point. */
function validateQ(q,lbl){
  if(!q||!q.question) return lbl+" has no \"question\" field.";
  if(!q.paper||PAPERS.indexOf(q.paper)<0) return lbl+": \"paper\" must be one of "+PAPERS.join(", ")+".";
  var hasCS=(q.tags||[]).some(function(t){return t[0]===CS;}),hasOther=(q.tags||[]).some(function(t){return t[0]!==CS;});
  if(hasCS&&q.paper!=="GS4") return lbl+": only GS4 questions can use the Case Studies branch.";
  if(hasCS&&hasOther) return lbl+": a case study is tagged only under Case Studies \u2014 remove the theory tags.";
  if(hasCS&&q.tags.length>1) return lbl+": a case study takes exactly one Case Studies tag \u2014 pick the single dominant dilemma.";
  if((q.tags||[]).length>1) return lbl+": one category per question \u2014 \"tags\" takes exactly one [Topic, Sub-topic] pair. Pick what the question is about, not everything it touches.";
  if(q.type===CASE_TYPE&&!hasCS) return lbl+": type is \"Case study\" but it has no Case Studies tag.";
  if(q.type!==CASE_TYPE&&hasCS) return lbl+": tagged under Case Studies but type is \""+(q.type||"")+"\".";
  if(q.type===CASE_TYPE&&!q.summary) return lbl+": case studies need a one-line \"summary\" field for the collapsed view.";
  var allSecs=(q.sections||[]).concat(
    (q.answers||[]).reduce(function(acc,a){return acc.concat(a.sections||[]);},[]));
  var badSec=allSecs.find(function(sc){return sc.frameworks&&sc.frameworks.length!==3;});
  if(badSec) return lbl+": section \""+badSec.heading+"\" needs exactly 3 framework options.";
  return null;
}

/* -------- ingest --------
   Parsing is separated from committing so an overwrite or a taxonomy change can be shown
   and confirmed first. An external AI reusing the template's "short-slug" id, or inventing
   a category, used to corrupt the bank silently. */
/* The parser knows exactly which character defeated it and says so; throwing
   that away for "check for a missing comma" leaves you re-reading 9KB by eye.
   The usual cause is a quote a model left unescaped inside a string, which is
   invisible in prose but obvious once you are looking at the right 70 characters. */
function jsonErr(e,src){
  var msg=String((e&&e.message)||"Not valid JSON").replace(/^JSON\.parse:\s*/,"");
  var m=/position (\d+)/.exec(msg), at=m?+m[1]:-1;
  if(at<0||at>src.length) return msg+".";
  var before=src.slice(Math.max(0,at-70),at).replace(/\s+/g," ");
  var after=src.slice(at,at+40).replace(/\s+/g," ");
  return msg+". It gave up here: …"+before+" ▸◂ "+after+"…";
}
function prepare(raw){
  var src=String(raw).replace(/^\s*```(?:json)?/i,"").replace(/```\s*$/,"");
  var parsed;
  try{ parsed=JSON.parse(src); }
  catch(e){ return {err:jsonErr(e,src)}; }

  if(parsed&&parsed.questions&&parsed.taxonomy) return {bank:parsed};

  var items=Array.isArray(parsed)?parsed:[parsed];
  for(var i=0;i<items.length;i++){
    var q=items[i];
    if(!q||!q.question) return {err:"Item "+(i+1)+" has no \"question\" field."};
    if(!q.id) q.id="q-"+Date.now()+"-"+i;
    if(!Array.isArray(q.tags)) q.tags=[];
    q.tags=q.tags.map(function(t){return Array.isArray(t)?t:[String(t)];});
    var err=validateQ(q,"Item "+(i+1));
    if(err) return {err:err};
  }
  return {items:items,collisions:collisionsFor(items),newCats:newCatsFor(items)};
}
function collisionsFor(items){
  var out=[];
  items.forEach(function(q){
    var ex=db.questions.filter(function(x){return x.id===q.id;})[0];
    if(ex) out.push({id:q.id,was:((isCase(ex)&&ex.summary)?ex.summary:ex.question)||""});
  });
  return out;
}
function newCatsFor(items){
  var out=[],seen={};
  items.forEach(function(q){
    var tax=db.taxonomy[q.paper]||{};
    (q.tags||[]).forEach(function(t){
      if(!t[0]) return;
      if(tax[t[0]]&&(!t[1]||tax[t[0]].indexOf(t[1])>-1)) return;
      var k=q.paper+"›"+t[0]+"›"+(t[1]||"");
      if(seen[k]) return; seen[k]=1;
      out.push({paper:q.paper,topic:t[0],sub:t[1]||""});
    });
  });
  return out;
}
/* `quiet` is for answers that land from a background generation: the bank takes
   them, but the sheet does not jump to the question and the view does not switch
   out from under whatever the reader is doing. */
function commitItems(items,quiet){
  var SKEL=["decode","intros","sections","conclusions","diagram","caption","vaBank","pitfalls"];
  items.forEach(function(item){
    var answer={id:"a"+Date.now().toString(36),model:item.model||"pasted",generatedAt:new Date().toISOString()};
    SKEL.forEach(function(k){ if(item[k]!==undefined) answer[k]=item[k]; });

    db.taxonomy[item.paper]=db.taxonomy[item.paper]||{};
    (item.tags||[]).forEach(function(t){
      if(!t[0])return;
      db.taxonomy[item.paper][t[0]]=db.taxonomy[item.paper][t[0]]||[];
      if(t[1]&&db.taxonomy[item.paper][t[0]].indexOf(t[1])<0) db.taxonomy[item.paper][t[0]].push(t[1]);
    });

    var existing=db.questions.filter(function(x){return x.id===item.id;})[0];
    if(existing){
      // never overwrite work: a pasted skeleton is stored alongside, not instead of
      normalizeQ(existing);
      existing.answers.push(answer);
      if(!quiet){ current=existing; answerIdx=existing.answers.length-1; view="ai"; }
    } else {
      var q={id:item.id,paper:item.paper,source:item.source||"Test series",type:item.type,
             question:item.question,tags:item.tags||[],
             answers:(answer.intros||answer.sections)?[answer]:[],
             mine:{intro:"",sections:[],conclusion:""},notes:""};
      if(item.year!=null) q.year=item.year;
      if(item.summary) q.summary=item.summary;
      db.questions.push(q);
      if(!quiet){ current=q; answerIdx=0; view="ai"; }
    }
  });
  if(!quiet) homeMode=false;
  return items.length;
}
function reportHtml(collisions,newCats){
  var h="";
  if(collisions.length){
    h+='<div class="collide"><strong>'+collisions.length+' id'+(collisions.length===1?'':'s')+
      ' already in the bank — saving replaces '+(collisions.length===1?'it':'them')+':</strong><ul>'+
      collisions.map(function(c){return '<li>'+esc(c.id)+' — '+esc(c.was.slice(0,90))+'</li>';}).join('')+'</ul></div>';
  }
  if(newCats.length){
    h+='<div class="collide"><strong>'+newCats.length+' categor'+(newCats.length===1?'y':'ies')+
      ' not in your taxonomy — decide '+(newCats.length===1?'it':'each')+' before saving:</strong>'+
      '<div class="ncmap">'+newCats.map(function(c,i){
        return '<div class="ncrow"><span class="ncwas">'+esc(c.paper)+' › '+esc(c.topic)+
          (c.sub?' › '+esc(c.sub):'')+'</span>'+
          '<select data-nc="'+i+'"><option value="new">add as new</option>'+
            '<option value="skip">drop this tag</option>'+
            taxPairs(c.paper).map(function(p){
              return '<option value="'+esc(p[0]+"›"+p[1])+'">use '+
                     esc(p[0]+(p[1]?" › "+p[1]:""))+'</option>';
            }).join('')+
          '</select></div>';
      }).join('')+'</div></div>';
  }
  return h;
}
function taxPairs(paper){
  var tax=db.taxonomy[paper]||{}, out=[];
  Object.keys(tax).sort().forEach(function(topic){
    var subs=(tax[topic]||[]).slice().sort();
    if(!subs.length){ out.push([topic,""]); return; }
    subs.forEach(function(sub){ out.push([topic,sub]); });
  });
  return out;
}
/* Rule 3 of the bank: a category nothing in the taxonomy matches is proposed,
   never added quietly. Showing them was only half of it — "Ethics & Human
   Interface" and "Ethics and Human Interface" are two different topics as far
   as the tree is concerned, so the chance to fold one into the other has to be
   offered here, at the confirmation, or it never gets taken. Read straight off
   the dialog, which is still on screen when the second click commits. */
function applyCatChoices(items,newCats){
  var map={};
  document.querySelectorAll("#dlgSlot [data-nc]").forEach(function(sel){
    var c=newCats[+sel.getAttribute("data-nc")];
    if(c&&sel.value!=="new") map[c.paper+"›"+c.topic+"›"+(c.sub||"")]=sel.value;
  });
  if(!Object.keys(map).length) return;
  items.forEach(function(q){
    var seen={};
    q.tags=(q.tags||[]).map(function(t){
      var to=map[q.paper+"›"+t[0]+"›"+(t[1]||"")];
      if(to===undefined) return t;
      if(to==="skip") return null;
      var p=to.split("›");
      return p[1]?[p[0],p[1]]:[p[0]];
    }).filter(function(t){                       // a remap can collide with a tag already there
      if(!t) return false;
      var k=t[0]+"›"+(t[1]||"");
      if(seen[k]) return false;
      seen[k]=1; return true;
    });
  });
}

function sortKeys(o){
  if(Array.isArray(o)) return o.map(sortKeys);
  if(o&&typeof o==="object"){var out={};Object.keys(o).sort().forEach(function(k){out[k]=sortKeys(o[k]);});return out;}
  return o;
}
function byId(a,b){return a.id<b.id?-1:a.id>b.id?1:0;}
/* The eight data/ files, exactly as they should appear on disk.
   sortKeys applies to the questions too, not just the taxonomy - CLAUDE.md rule 5 - so an
   app write and a Claude Code write of the same content are byte-identical and diff cleanly. */
function buildFiles(){
  var SLUG={"Essay":"essay","GS1":"gs1","GS2":"gs2","GS3":"gs3","GS4":"gs4"};
  var out=[], papers={};

  // PYQs are sharded by paper and year - one file per exam paper. Without this the
  // 8-file writer would drop every shard from the manifest on the first Save.
  var shards={};
  db.questions.filter(function(q){return q.source==="PYQ";}).forEach(function(q){
    var name="pyq/"+SLUG[q.paper]+"-"+(q.year||"undated")+".json";
    (shards[name]=shards[name]||[]).push(q);
  });

  var authored=db.questions.filter(function(q){return q.source!=="PYQ";});
  var gs4=authored.filter(function(q){return q.paper==="GS4";});
  function add(name,arr){ out.push({path:"data/"+name,text:JSON.stringify(sortKeys(arr.sort(byId)),null,2)+"\n"}); }

  Object.keys(FILES).forEach(function(p){
    add(FILES[p],authored.filter(function(q){return q.paper===p;}));
    papers[p]=[FILES[p]];
  });
  add("gs4-theory.json",gs4.filter(function(q){return !isCase(q);}));
  add("gs4-case-studies.json",gs4.filter(isCase));
  papers.GS4=["gs4-theory.json","gs4-case-studies.json"];

  Object.keys(shards).sort().forEach(function(name){
    add(name,shards[name]);
    var paper=null;
    Object.keys(SLUG).forEach(function(p){ if(name.indexOf("pyq/"+SLUG[p]+"-")===0) paper=p; });
    if(paper) papers[paper]=(papers[paper]||[]).concat([name]);
  });

  var manifest={schemaVersion:db.schemaVersion||1,exported:new Date().toISOString().slice(0,10),
                taxonomy:"taxonomy.json",papers:papers};
  out.unshift({path:"data/manifest.json",text:JSON.stringify(sortKeys(manifest),null,2)+"\n"});
  out.push({path:"data/taxonomy.json",text:JSON.stringify(sortKeys(db.taxonomy),null,2)+"\n"});
  return out;
}

  var files=buildFiles();

      var b=new Blob([f.text],{type:"application/json"});

      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
    },i*350);
  });
  addedSinceExport=0;
  toast("Writing "+files.length+" files — allow multiple downloads if asked. They go in data/.");
}

/* -------- GitHub: one commit per save, with fast-forward conflict detection -------- */
function ghUrl(p){return "https://api.github.com/repos/"+ghCfg.owner+"/"+ghCfg.repo+p;}
async function ghFetch(p,opts){
  opts=opts||{};
  var h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(ghCfg.token) h.Authorization="Bearer "+ghCfg.token;
  if(opts.body) h["Content-Type"]="application/json";
  var r=await fetch(ghUrl(p),{method:opts.method||"GET",headers:h,
    body:opts.body?JSON.stringify(opts.body):undefined});
  var t=await r.text(),j=null;
  try{j=t?JSON.parse(t):null;}catch(e){}
  if(!r.ok){
    var m=(j&&j.message)||("HTTP "+r.status);
    if(r.status===401) m="GitHub rejected the token — it may have expired, or lack Contents write access.";
    if(r.status===403) m="GitHub refused: "+m+". A fine-grained token needs Contents: Read and write on this repo.";
    if(r.status===404) m="Repo not found, or the token cannot see it. Check owner/repo and the token's repository access.";
    if(r.status===409) m="Branch \""+ghCfg.branch+"\" not found, or the repository is empty. Push one commit first.";
    var err=new Error(m);err.status=r.status;throw err;
  }
  return j;
}
function b64(s){
  // btoa is byte-oriented; encode UTF-8 first or any non-ASCII in the bank corrupts
  var bytes=new TextEncoder().encode(s),bin="";
  bytes.forEach(function(b){bin+=String.fromCharCode(b);});
  return btoa(bin);
}
async function ghHeadSha(){
  var ref=await ghFetch("/git/ref/heads/"+encodeURIComponent(ghCfg.branch));
  return ref.object.sha;
}
async function ghCommit(files,message,expectedBase){
  var head=await ghHeadSha();
  // the real conflict guard: fast-forward alone would silently absorb someone else's commit,
  // because we would be building on top of it rather than on what this page actually loaded
  if(expectedBase&&head!==expectedBase){
    var moved=new Error("The branch has moved since this page loaded.");
    moved.remoteMoved=true;moved.head=head;throw moved;
  }
  var commit=await ghFetch("/git/commits/"+head);
  var blobs=[];
  for(var i=0;i<files.length;i++){
    var b=await ghFetch("/git/blobs",{method:"POST",body:{content:b64(files[i].text),encoding:"base64"}});
    blobs.push({path:files[i].path,mode:"100644",type:"blob",sha:b.sha});
  }
  var tree=await ghFetch("/git/trees",{method:"POST",body:{base_tree:commit.tree.sha,tree:blobs}});
  var nc=await ghFetch("/git/commits",{method:"POST",body:{message:message,tree:tree.sha,parents:[head]}});
  // force:false - GitHub refuses a non-fast-forward, which is the conflict guard
  await ghFetch("/git/refs/heads/"+encodeURIComponent(ghCfg.branch),
    {method:"PATCH",body:{sha:nc.sha,force:false}});
  return nc.sha;
}

/* -------- prompt: assembled per paper, with the live taxonomy baked in -------- */
function taxonomyLines(paper,filter){
  var tax=db.taxonomy[paper]||{},lines=[];
  Object.keys(tax).sort().forEach(function(topic){
    if(filter==="onlyCaseStudies"&&topic!==CS) return;
    if(filter==="excludeCaseStudies"&&topic===CS) return;
    var subs=(tax[topic]||[]).slice().sort();
    if(!subs.length){lines.push('  ["'+topic+'", ""]');return;}
    subs.forEach(function(sub){lines.push('  ["'+topic+'", "'+sub+'"]');});
  });
  return lines.length?lines.join("\n")
    :"  (nothing defined for this paper yet — pick the closest fit and say so in notes rather than inventing one)";
}
function buildPrompt(key){
  if(!prompts) return "";
  var p=null;
  (prompts.papers||[]).forEach(function(x){if(x.key===key)p=x;});
  if(!p) return "";
  var sh=prompts.shared||{};
  var schema=(sh.schema||[]).join("\n")
    .replace("<PAPER>",p.paper).replace("<TYPE>",p.type).replace("<LIMIT>",p.limit);
  return [
    (sh.opening||[]).join("\n"),
    "",
    "PAPER: "+p.label,
    'Set "paper" to "'+p.paper+'" and "type" to "'+p.type+'".',
    "Assume "+p.limit+" unless the question itself states otherwise.",
    "",
    "SCHEMA — return exactly this shape:",
    "",
    schema,
    "",
    (sh.rules||[]).join("\n"),
    "",
    (p.guidance||[]).join("\n"),
    "",
    "CATEGORIES YOU MAY TAG INTO — this is my live taxonomy. Use these verbatim; invent nothing:",
    taxonomyLines(p.paper,p.taxonomyFilter),
    "",
    (sh.selfCheck||[]).join("\n"),
    "",
    "----",
    "Question:",
    ""
  ].join("\n");
}
