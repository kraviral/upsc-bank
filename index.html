/* ==================== generation ====================
   The API key lives in this closure and nowhere else — never localStorage,
   never the repo, never the page source. A reload forgets it.

   Generation is refused anywhere but localhost. That is the whole answer to
   "can a visitor spend my credit": the deployed copy has no key in it and
   will not ask for one, so there is nothing on the public page to spend.
   The gate is belt-and-braces on top of that — a visitor who edits the check
   out in devtools still has only their own key to spend. */
var genKey="", genModel="", orModels=null, orCredits=null;

/* Usage ledger. Per model, on this device only — never the repo, which is
   public, and never a commit. Cost here is an ESTIMATE: token counts the API
   reported, priced from a table. It will drift from the real invoice (prompt
   caching, rounding, BYOK fees), which is why the OpenRouter figure is fetched
   and shown beside it rather than instead of it. */
var USEKEY="upsc-gen-usage"+SCOPE, useLedger={};
function useLoad(){ try{ useLedger=JSON.parse(localStorage.getItem(USEKEY))||{}; }catch(e){ useLedger={}; } }
function useSave(){ try{ localStorage.setItem(USEKEY,JSON.stringify(useLedger)); }catch(e){} }
function useBook(model,inTok,outTok,usd,failed){
  var r=useLedger[model]||(useLedger[model]={calls:0,failed:0,inTok:0,outTok:0,usd:0});
  r.calls++; if(failed) r.failed++;
  r.inTok+=inTok||0; r.outTok+=outTok||0; r.usd+=usd||0; r.last=new Date().toISOString();
  useSave();
}
function useTotal(){
  var t={calls:0,failed:0,inTok:0,outTok:0,usd:0};
  Object.keys(useLedger).forEach(function(m){
    var r=useLedger[m];
    t.calls+=r.calls||0; t.failed+=r.failed||0;
    t.inTok+=r.inTok||0; t.outTok+=r.outTok||0; t.usd+=r.usd||0;
  });
  return t;
}

function isLocal(){
  var h=location.hostname;
  return h==="localhost"||h==="127.0.0.1"||h==="::1"||h==="[::1]"||h==="";
}
/* USD per million tokens, from OpenRouter's own live list so nothing here goes
   stale or gets invented. Claude is still reachable — as anthropic/claude-*. */
function priceFor(model){
  var o=(orModels||[]).filter(function(x){return x.id===model;})[0];
  if(!o||!o.pricing) return {inM:0,outM:0};
  return {inM:parseFloat(o.pricing.prompt||0)*1e6, outM:parseFloat(o.pricing.completion||0)*1e6};
}
function usdFor(model,i,o){var p=priceFor(model);return (i/1e6)*p.inM+(o/1e6)*p.outM;}
function money(n){ return n<0.01 ? ("$"+n.toFixed(4)) : ("$"+n.toFixed(2)); }

/* The authoritative number. My ledger is arithmetic on reported tokens; this is
   what OpenRouter will actually bill. Shown beside the estimate, not instead of
   it, so drift between them is visible. Anthropic has no equivalent for a plain
   API key — its usage report needs an admin key — so there it stays estimated. */
async function fetchOrCredits(){
  if(!genKey) return null;
  try{
    var r=await fetch("https://openrouter.ai/api/v1/credits",{headers:{authorization:"Bearer "+genKey}});
    if(!r.ok) return null;
    var j=await r.json(), d=j.data||j;
    var used=(d.total_usage!=null)?d.total_usage:d.usage;
    var gran=(d.total_credits!=null)?d.total_credits:d.limit;
    if(used==null) return null;
    orCredits={usage:used,limit:(gran==null?null:gran)};
    return orCredits;
  }catch(e){ return null; }
}
async function fetchOpenRouterModels(){
  if(orModels) return orModels;
  /* The unfiltered catalogue also contains music, image and audio generators.
     They can return a perfectly successful stream whose `content` is a lyric
     transcript rather than an answer, so ask for text models and enforce the
     same constraint locally in case a provider's metadata is over-broad. */
  var r=await fetch("https://openrouter.ai/api/v1/models?output_modalities=text");
  if(!r.ok) throw new Error("model list unavailable ("+r.status+")");
  var j=await r.json();
  orModels=(j.data||[]).filter(function(m){return isTextOnlyModel(m)&&canFitSkeleton(m)&&modelSupportsJson(m);}).sort(function(a,b){
    var af=parseFloat((a.pricing||{}).prompt||0)===0, bf=parseFloat((b.pricing||{}).prompt||0)===0;
    if(af!==bf) return af?-1:1;                       // free models first
    return String(a.id).localeCompare(String(b.id));
  });
  return orModels;
}
function modelInfo(id){
  return (orModels||[]).filter(function(m){return m.id===id;})[0]||null;
}
function isTextOnlyModel(m){
  var a=(m&&m.architecture)||{}, out=a.output_modalities||[];
  if(out.length) return out.length===1&&out[0]==="text";
  return !a.modality||/->text$/.test(a.modality);
}
function modelOutputLimit(m){
  var n=m&&m.top_provider&&Number(m.top_provider.max_completion_tokens);
  return n>0?n:null;
}
function canFitSkeleton(m){
  var n=modelOutputLimit(m);
  return n===null||n>=12000;
}
function completionBudget(id){
  var n=modelOutputLimit(modelInfo(id));
  return n===null?24000:Math.min(24000,n);
}
function modelSupportsJson(m){
  var p=(m&&m.supported_parameters)||[];
  return p.indexOf("response_format")>-1;
}
function supportsJsonMode(id){
  return modelSupportsJson(modelInfo(id));
}
function supportsReasoningControl(id){
  var m=modelInfo(id), p=(m&&m.supported_parameters)||[];
  return p.indexOf("reasoning")>-1||p.indexOf("reasoning_effort")>-1;
}

/* Streams a completion. onDelta gets text as it arrives so a 40-second
   generation shows progress instead of looking hung. Streaming also avoids the
   API refusing a large non-streamed max_tokens. */
/* cfg pins the model and key for the life of one call and carries that call's
   own AbortController — several generations can be in the air at once, and the
   picker may have moved on since any of them started. */
async function callModel(prompt,onDelta,cfg){
  cfg=cfg||{model:genModel,key:genKey};
  var url="https://openrouter.ai/api/v1/chat/completions",
      headers={"content-type":"application/json","authorization":"Bearer "+cfg.key},
      body={model:cfg.model,max_completion_tokens:cfg.maxCompletion||24000,stream:true,
            stream_options:{include_usage:true},
            messages:[{role:"user",content:prompt}]};
  /* JSON mode is used only when the selected model advertises support. Requiring
     the parameter prevents OpenRouter from silently routing to an endpoint that
     ignores it. Models without it still use the prompt plus strict validation. */
  if(cfg.jsonMode){
    body.response_format={type:"json_object"};
    body.provider={require_parameters:true};
  }
  /* Reasoning tokens share the completion ceiling with visible JSON. A model
     spending most of that allowance thinking can stop halfway through a string,
     even when the visible answer is modest. Minimal effort preserves some
     planning while reserving the budget for the actual skeleton. */
  if(cfg.reasoningControl){
    body.reasoning={effort:"minimal",exclude:true};
    body.provider={require_parameters:true};
  }
  cfg.abort=new AbortController();
  var res=await fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body),signal:cfg.abort.signal});
  /* `supported_parameters` is a model-wide union: JSON mode and reasoning may
     each exist somewhere while no single provider endpoint supports both. If
     that strict combination has no route, drop only the optional reasoning
     control and retry. Never drop JSON mode: prompt-only JSON from a weak model
     can look complete yet contain stray quotes and broken fields. */
  if(res.status===404&&body.response_format&&body.reasoning){
    var routeDetail=await res.clone().text();
    if(/no endpoints found.*requested parameters/i.test(routeDetail)){
      delete body.reasoning;
      cfg.reasoningFallback=true;
      res=await fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body),signal:cfg.abort.signal});
    }
  }
  if(!res.ok){
    var detail=await res.text();
    try{ var j=JSON.parse(detail); detail=(j.error&&(j.error.message||j.error.type))||detail; }catch(e){}
    if(res.status===404&&/no endpoints found.*requested parameters/i.test(detail)&&body.response_format)
      throw new Error("This model has no provider endpoint supporting the required JSON mode. Pick another model from the list.");
    throw new Error("HTTP "+res.status+" — "+String(detail).slice(0,300));
  }
  var reader=res.body.getReader(), dec=new TextDecoder(), buf="", text="", inTok=0, outTok=0, stop="";
  for(;;){
    var chunk=await reader.read();
    if(chunk.done) break;
    buf+=dec.decode(chunk.value,{stream:true});
    var lines=buf.split("\n"); buf=lines.pop();
    for(var i=0;i<lines.length;i++){
      var ln=lines[i].trim();
      if(ln.indexOf("data:")!==0) continue;
      var payload=ln.slice(5).trim();
      if(payload==="[DONE]") continue;
      var ev; try{ ev=JSON.parse(payload); }catch(e){ continue; }
      var ch=ev.choices&&ev.choices[0], d=ch&&ch.delta;
      if(d&&typeof d.content==="string"&&d.content){ text+=d.content; onDelta&&onDelta(text); }
      if(ch&&ch.finish_reason) stop=ch.finish_reason;
      if(ev.usage){ inTok=ev.usage.prompt_tokens||inTok; outTok=ev.usage.completion_tokens||outTok; }
    }
  }
  return {text:text,inTok:inTok,outTok:outTok,stop:stop,reasoningFallback:!!cfg.reasoningFallback};
}

/* Why the model stopped, when it stopped somewhere other than the end. Both of
   these come back as a perfectly successful HTTP 200 carrying either nothing or
   half an object, so left to the JSON parser they read as "not valid JSON" and
   send you hunting for a missing bracket that was never the problem. */
function stopNote(stop){
  if(stop==="length")
    return "The model hit its output ceiling, so the JSON is cut off. A reasoning model spends part "+
           "of that ceiling thinking; a model that reasons less will usually fit.";
  if(stop==="content_filter")
    return "A content filter stopped this one. Another model will usually take it.";
  if(stop==="error")
    return "The provider reported an error part-way through, so the reply is incomplete.";
  return "";
}
function replyKindNote(raw){
  raw=String(raw||"");
  if(/\[\[[A-Z]\d+\]\]/.test(raw)||/^\[\d+(?:\.\d+)?:\]/m.test(raw))
    return "The selected model returned a song or audio transcript instead of JSON. Pick one of the listed text models and generate again.";
  return "";
}

/* prepare() also supports importing a bare question, but generation must return
   a complete answer skeleton. Keep that stricter contract here so malformed or
   unrelated JSON can never be attached as an apparently successful answer. */
function generatedSkeletonError(item,n){
  var p="Generated item "+n;
  if(!item||!item.decode||typeof item.decode!=="object") return p+" has no decode object.";
  if(!Array.isArray(item.intros)||item.intros.length!==3) return p+" needs exactly 3 introductions.";
  if(!Array.isArray(item.sections)||!item.sections.length) return p+" has no answer sections.";
  for(var i=0;i<item.sections.length;i++){
    var s=item.sections[i];
    if(!s||!Array.isArray(s.frameworks)||s.frameworks.length!==3)
      return p+": section "+(i+1)+" needs exactly 3 framework options.";
  }
  if(!Array.isArray(item.conclusions)||item.conclusions.length!==3) return p+" needs exactly 3 conclusions.";
  if(!item.vaBank||typeof item.vaBank!=="object") return p+" has no value-addition bank.";
  return "";
}

function meterHtml(){
  var t=useTotal();
  if(!t.calls) return '<span class="ph">nothing generated on this device yet</span>';
  var per=Object.keys(useLedger).sort(function(a,b){return useLedger[b].usd-useLedger[a].usd;});
  var h='<div class="usehead">all time on this device — '+t.calls+' call'+(t.calls===1?'':'s')+
    (t.failed?(' ('+t.failed+' rejected but billed)'):'')+', '+
    t.inTok.toLocaleString()+' in / '+t.outTok.toLocaleString()+' out, <b>'+money(t.usd)+'</b> estimated</div>'+
    '<div class="usetab">'+per.map(function(m){
      var r=useLedger[m];
      return '<div class="userow"><span class="orid">'+esc(m)+'</span>'+
        '<span class="orused">'+r.calls+'×'+(r.failed?(' · '+r.failed+' bad'):'')+'</span>'+
        '<span class="orcost">'+money(r.usd)+'</span></div>';
    }).join('')+'</div>';
  h+='<div class="usehead">'+(orCredits
    ? 'OpenRouter says <b>'+money(orCredits.usage)+'</b> used'+
      (orCredits.limit!=null?(' of '+money(orCredits.limit)+' limit'):'')+' — that figure is the billable one'
    : '<span class="ph">enter your key and press Generate to read OpenRouter\'s own total</span>')+'</div>';
  return h;
}
function refreshGenMeter(){ var m=$("genMeter"); if(m) m.innerHTML=meterHtml(); }

/* -------- generation runs in the background --------
   The dialog only collects the settings; the request outlives it. A job holds
   its question by id rather than by reference, so the answer lands on the right
   question however far you have browsed away — and it is committed quietly, so
   nothing yanks the sheet back or switches the view under you. */
var genJobs=[], genSeq=0;
function jobById(n){ return genJobs.filter(function(j){return j.n===n;})[0]; }
function jobStatus(j){
  if(j.state==="running"){
    if(!j.text) return "thinking…";
    return j.text.length<1000 ? (j.text.length+" chars") : ((Math.round(j.text.length/100)/10)+"k chars");
  }
  if(j.state==="done") return "done · "+j.msg;
  if(j.state==="cancelled") return "cancelled";
  return "failed";
}
function paintJobs(){
  var el=$("genstrip"); if(!el) return;
  el.innerHTML=genJobs.map(function(j){
    return '<div class="genjob '+j.state+'">'+
      '<div class="gj1"><span class="gjm">'+esc(j.model)+'</span>'+
        '<span class="gjs">'+esc(jobStatus(j))+'</span></div>'+
      '<span class="gjq">'+esc(j.label.slice(0,110))+'</span>'+
      (j.state==="err"&&j.msg?'<span class="gjw">'+esc(String(j.msg))+'</span>':'')+
      '<div class="gjb">'+
        (j.state==="running"?'<button data-gjc="'+j.n+'">Cancel</button>':'')+
        (j.raw?'<button data-gjr="'+j.n+'">Copy reply</button>':'')+
        (j.state==="running"?'':'<button data-gjx="'+j.n+'">Dismiss</button>')+
      '</div></div>';
  }).join("");
  el.querySelectorAll("[data-gjc]").forEach(function(b){
    b.onclick=function(){ var j=jobById(+b.getAttribute("data-gjc")); if(j&&j.cfg&&j.cfg.abort) j.cfg.abort.abort(); };
  });
  el.querySelectorAll("[data-gjr]").forEach(function(b){
    b.onclick=function(){
      var j=jobById(+b.getAttribute("data-gjr")); if(!j) return;
      navigator.clipboard.writeText(j.raw).then(function(){toast("Raw reply copied — paste it into Add.");},
        function(){toast("Clipboard refused. The reply is in the console.");console.log(j.raw);});
    };
  });
  el.querySelectorAll("[data-gjx]").forEach(function(b){
    b.onclick=function(){ genJobs=genJobs.filter(function(j){return j.n!==+b.getAttribute("data-gjx");}); paintJobs(); };
  });
}
/* A re-render replaces every box on the sheet, caret included. If the reader is
   mid-sentence the answer still goes into the bank — the sheet just catches up
   the next time it is drawn. */
function rerenderIfIdle(){
  var a=document.activeElement;
  if(a&&(a.isContentEditable||a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return false;
  renderSheet(); return true;
}
function startGeneration(q){
  var job={n:++genSeq,qid:q.id,state:"running",text:"",msg:"",raw:"",
           model:genModel,
           label:(isCase(q)&&q.summary)?q.summary:(q.question||q.id),
           cfg:{model:genModel,key:genKey,jsonMode:supportsJsonMode(genModel),
                reasoningControl:supportsReasoningControl(genModel),maxCompletion:completionBudget(genModel)}};
  genJobs.push(job); paintJobs();
  callModel(generationPrompt(q),function(t){ job.text=t; paintJobs(); },job.cfg)
    .then(async function(out){
      /* Book the tokens the moment they come back. A reply that fails to parse
         has already been paid for; counting only successes made the worst
         models look like the cheapest. */
      var spent=usdFor(job.model,out.inTok,out.outTok);
      var res=prepare(out.text);
      if(!res.err){
        for(var ri=0;ri<res.items.length;ri++){
          var shapeErr=generatedSkeletonError(res.items[ri],ri+1);
          if(shapeErr){res={err:shapeErr};break;}
        }
      }
      useBook(job.model,out.inTok,out.outTok,spent,!!res.err);
      refreshGenMeter();
      fetchOrCredits().then(refreshGenMeter);
      if(res.err){
        // a stop the model chose explains the bad reply better than the parser can
        var why=stopNote(out.stop)||replyKindNote(out.text)||res.err;
        job.state="err"; job.msg=why+" — "+money(spent)+" estimated"; job.raw=out.text;
        paintJobs();
        toast(out.stop==="length"?"Cut off at the token ceiling — nothing usable.":
              "Generation could not be parsed — billed "+money(spent)+".");
        return;
      }
      var target=db.questions.filter(function(x){return x.id===job.qid;})[0];
      if(!target){
        job.state="err"; job.msg="that question is no longer in the bank"; job.raw=out.text;
        paintJobs(); return;
      }
      // force it onto THIS question so a model that invents an id cannot create a stray entry
      res.items.forEach(function(it){
        it.id=target.id; it.paper=target.paper; it.question=target.question;
        it.tags=target.tags; it.type=target.type; it.model=job.model;
        if(target.year!=null) it.year=target.year;
        if(target.summary) it.summary=target.summary;
      });
      commitItems(res.items,true);
      await save(); renderNav();
      var shown=(current&&current.id===job.qid) ? rerenderIfIdle() : true;
      job.state="done"; job.msg=money(spent)+" · "+out.inTok+" in / "+out.outTok+" out"+
        (out.reasoningFallback?" · JSON route":"");
      paintJobs();
      toast("Skeleton ready — "+money(spent)+(shown?"":". Reopen the question to see it."));
    })
    .catch(function(e){
      job.state=(e&&e.name==="AbortError")?"cancelled":"err";
      job.msg=(e&&e.message)||String(e);
      paintJobs();
      if(job.state==="err") toast("Generation failed — "+job.msg);
    });
}
window.addEventListener("beforeunload",function(e){
  if(genJobs.some(function(j){return j.state==="running";})){ e.preventDefault(); e.returnValue=""; }
});

function promptKeyFor(q){
  return q.paper==="GS4" ? (isCase(q)?"GS4-case":"GS4-theory") : q.paper;
}
/* The model is given the same prompt as the Copy prompt button, with the
   question appended — so a generated skeleton and a hand-pasted one are
   produced by identical instructions and are comparable. */
function generationPrompt(q){
  return buildPrompt(promptKeyFor(q))+q.question+
    "\n\nReturn only the JSON object. No prose, no markdown fences. "+
    "Keep the complete reply under 12000 output tokens: use concise one-line points, exactly 3 points per framework, "+
    "and no placeholder evidence such as 'example of X'. Complete and close every JSON array and object.";
}

var orFilter="", orFreeOnly=false, estIn=4400, estOut=5000;
/* What one generation on this question actually costs, rather than a price per
   million tokens the reader has to do arithmetic on. */
/* OpenRouter's meta-routers (openrouter/auto and friends) price at -1 as a
   sentinel meaning "depends which model it picks". Left as a number that is
   less than zero it sorts above everything and counts as free, which is the
   opposite of true. null means unknown. */
function estCost(m){
  var pi=parseFloat((m.pricing||{}).prompt||0), po=parseFloat((m.pricing||{}).completion||0);
  if(pi<0||po<0) return null;
  return estIn*pi+estOut*po;
}
function orListHtml(){
  var f=orFilter.toLowerCase();
  var rows=(orModels||[]).filter(function(m){
    var c=estCost(m);
    if(orFreeOnly&&c!==0) return false;          // unknown is not free
    if(!f) return true;
    return (m.id+" "+(m.name||"")).toLowerCase().indexOf(f)>-1;
  });
  rows.sort(function(a,b){
    var x=estCost(a), y=estCost(b);
    if(x===null&&y===null) return 0;
    if(x===null) return 1;                        // unknown pricing sinks
    if(y===null) return -1;
    return x-y;
  });
  if(!rows.length) return '<p class="ph">nothing matches that filter.</p>';
  return rows.slice(0,60).map(function(m){
    var c=estCost(m), ctx=m.context_length?(Math.round(m.context_length/1000)+"k"):"—";
    var u=useLedger[m.id];
    return '<div class="orrow'+(m.id===genModel?' on':'')+'" data-mid="'+esc(m.id)+'">'+
      '<span class="orid">'+esc(m.id)+'</span>'+
      '<span class="orused">'+(u&&u.calls?(u.calls+"× "+money(u.usd)):"")+'</span>'+
      '<span class="orcost">'+(c===null?"varies":(c===0?"free":money(c)))+'</span>'+
      '<span class="orctx">'+ctx+'</span></div>';
  }).join('')+(rows.length>60?'<p class="ph">'+(rows.length-60)+' more — narrow the filter.</p>':'');
}
function genDialog(q){
  if(!isLocal()){
    openDlg("Generation runs on localhost only",
      "This is the deployed copy. Clone the repo, run python -m http.server, and open it there.",
      '<p class="ph">No API key is stored in this page, so nothing here can be charged to anyone. '+
      'Use Copy prompt instead and paste into any AI.</p>',null,null);
    return;
  }
  if(!prompts){toast("data/prompts.json did not load.");return;}
  function modelPicker(){
    if(!orModels) return '<span class="ph">loading model list…</span>';
    return '<input id="genModelTxt" value="'+esc(genModel)+'" placeholder="model id, e.g. anthropic/claude-opus-5">';
  }
  function slot(){
    return '<div class="genrow"><label>Model</label><span id="genModelWrap">'+modelPicker()+'</span></div>'+
      '<div class="genrow"><label>Filter</label>'+
        '<input id="orFilter" placeholder="name or maker, e.g. gemini, qwen, claude" value="'+esc(orFilter)+'">'+
        '<label style="width:auto"><input type="checkbox" id="orFree"'+(orFreeOnly?' checked':'')+'> free only</label>'+
      '</div><div id="orList" class="orlist">'+orListHtml()+'</div>'+
      '<div class="genrow"><label>API key</label>'+
        '<input id="genKey" type="password" autocomplete="off" spellcheck="false" value="'+esc(genKey)+'" '+
        'placeholder="sk-or-…"></div>'+
      '<p class="ph">Kept in a variable for this tab only — never written to disk, never committed. '+
        'That is why it is already filled in if you have generated once since loading the page; '+
        'a reload forgets it.</p>'+
      '<div id="genMeter" class="usemeter">'+meterHtml()+'</div>';
  }
  function keepKey(){ var k=$("genKey"); if(k) genKey=k.value; }
  function repaint(){ keepKey(); $("dlgSlot").innerHTML=slot(); wire(); }
  function wire(){ wireModel(); }
  function wireModel(){
    var t=$("genModelTxt"); if(t) t.oninput=function(){genModel=t.value.trim();paintList();};
    var f=$("orFilter");   if(f) f.oninput=function(){orFilter=f.value;paintList();};
    var fr=$("orFree");    if(fr) fr.onchange=function(){orFreeOnly=fr.checked;paintList();};
    paintRows();
  }
  function paintList(){ var l=$("orList"); if(l){l.innerHTML=orListHtml();paintRows();} }
  function paintRows(){
    var l=$("orList"); if(!l) return;
    l.querySelectorAll("[data-mid]").forEach(function(r){
      r.onclick=function(){
        genModel=r.getAttribute("data-mid");
        var t=$("genModelTxt"); if(t) t.value=genModel;
        paintList();
      };
    });
  }
  openDlg("Generate a skeleton",
    "Runs on your machine with your key. The same prompt as Copy prompt, sent for you. "+
    "It runs in the background — close this and keep working.",
    slot(),"Generate",function(){
      var kEl=$("genKey"); genKey=(kEl&&kEl.value||"").trim();
      if(!genKey){ $("dlgMsg").className="msg err"; $("dlgMsg").textContent="Enter an API key first."; return; }
      if(!genModel){ $("dlgMsg").className="msg err"; $("dlgMsg").textContent="Pick a model."; return; }
      if(orModels&&!modelInfo(genModel)){
        $("dlgMsg").className="msg err";
        $("dlgMsg").textContent="That model is not eligible: generation requires text output, JSON mode and at least a 12k-token output allowance. Pick one from the list.";
        return;
      }
      startGeneration(q);
      dlg.close();
      toast("Generating with "+genModel+" — it will attach itself when it lands.");
    });
  wire();
  if(!orModels) fetchOpenRouterModels().then(repaint).catch(function(){});
}

/* -------- categories: edit names, identical names merge -------- */
$("catBtn").onclick=function(){
  var rows=[],idx=0;
  PAPERS.forEach(function(p){
    var tax=db.taxonomy[p]||{};
    Object.keys(tax).forEach(function(topic){
      var subs=tax[topic]||[];
      if(!subs.length){rows.push({p:p,topic:topic,sub:"",i:idx++});return;}
      subs.forEach(function(sub){rows.push({p:p,topic:topic,sub:sub,i:idx++});});
    });
  });
  var html='<div class="cats">'+rows.map(function(r){
    var n=db.questions.filter(function(q){return q.paper===r.p&&(q.tags||[]).some(function(t){return t[0]===r.topic&&(r.sub?t[1]===r.sub:true);});}).length;
    return '<div class="catrow"><span class="pp">'+esc(r.p)+'</span>'+
      '<input data-i="'+r.i+'" data-f="topic" value="'+esc(r.topic)+'">'+
      '<input data-i="'+r.i+'" data-f="sub" value="'+esc(r.sub)+'">'+
      '<span class="n">'+n+'</span></div>';
  }).join('')+'</div>';
  openDlg("Categories","Edit any name and apply. Two rows given the same name merge into one. Counts are questions currently tagged there.",html,"Apply",async function(){
    var edits={};
    $("dlgSlot").querySelectorAll("input").forEach(function(inp){
      var i=+inp.getAttribute("data-i");edits[i]=edits[i]||{};edits[i][inp.getAttribute("data-f")]=inp.value.trim();
    });
    var changed=0,blocked=false;
    rows.forEach(function(r){
      var e=edits[r.i];if(!e||!e.topic)return;
      if(e.topic===r.topic&&e.sub===r.sub)return;
      if((r.topic===CS)!==(e.topic===CS)){blocked=true;return;}
      changed++;
      db.questions.forEach(function(q){
        if(q.paper!==r.p)return;
        (q.tags||[]).forEach(function(t){
          if(t[0]===r.topic&&((r.sub&&t[1]===r.sub)||(!r.sub&&!t[1]))){t[0]=e.topic;if(e.sub)t[1]=e.sub;else t.length=1;}
        });
        var seen={};q.tags=(q.tags||[]).filter(function(t){var k=t.join("›");if(seen[k])return false;seen[k]=1;return true;});
      });
      var tax=db.taxonomy[r.p]||{};
      if(tax[r.topic]){
        tax[r.topic]=tax[r.topic].filter(function(s){return s!==r.sub;});
        if(!tax[r.topic].length&&r.sub) delete tax[r.topic];
      }
      tax[e.topic]=tax[e.topic]||[];
      if(e.sub&&tax[e.topic].indexOf(e.sub)<0) tax[e.topic].push(e.sub);
      db.taxonomy[r.p]=tax;
    });
    if(blocked){$("dlgMsg").textContent="Categories cannot move into or out of Case Studies \u2014 that split is fixed.";return;}
    if(!changed){dlg.close();return;}
    await save();renderNav();renderSheet();dlg.close();
    toast(changed+" categor"+(changed===1?"y":"ies")+" updated.");
  });
};

function nudge(){
  if(addedSinceExport>=10){toast("10 added since your last save — worth committing a backup.");addedSinceExport=0;}
}

/* -------- drag & drop -------- */
var dz=$("drop"),depth=0;
window.addEventListener("dragenter",function(e){e.preventDefault();depth++;dz.classList.add("on");});
window.addEventListener("dragover",function(e){e.preventDefault();});
window.addEventListener("dragleave",function(e){depth--;if(depth<=0){depth=0;dz.classList.remove("on");}});
window.addEventListener("drop",async function(e){
  e.preventDefault();depth=0;dz.classList.remove("on");
  var files=Array.prototype.slice.call(e.dataTransfer.files||[]).filter(function(f){return /\.json$/i.test(f.name);});
  if(!files.length){toast("Only .json files can be dropped.");return;}
  var items=[],errs=[];
  for(var i=0;i<files.length;i++){
    var text=await files[i].text();
    var r=prepare(text);
    if(r.err) errs.push(files[i].name+": "+r.err);
    else if(r.bank) errs.push(files[i].name+": that is a full bank — use Import.");
    else items=items.concat(r.items);
  }
  if(!items.length){toast(errs.length?errs[0]:"Nothing to add.");return;}

  // one confirmation covering every dropped file, rather than one per file
  var collisions=collisionsFor(items),newCats=newCatsFor(items);
  if(collisions.length||newCats.length){
    var staged=items;
    openDlg("Confirm before adding",files.length+" file"+(files.length===1?"":"s")+" parsed cleanly, but some ids or categories need a look.",
      reportHtml(collisions,newCats),"Add anyway",async function(){
        applyCatChoices(staged,newCats);
        var n=commitItems(staged);await save();addedSinceExport+=n;
        renderNav();renderSheet();dlg.close();toast(n+" question"+(n===1?"":"s")+" added.");nudge();
      });
    return;
  }
  var added=commitItems(items);
  await save();addedSinceExport+=added;renderNav();renderSheet();
  toast(errs.length?(added+" added, "+errs.length+" failed — "+errs[0]):(added+" question"+(added===1?"":"s")+" added."));
  nudge();
});

  $("themeBtn").textContent=(t==="dark")?"Light":"Dark";   // the label is what a click does
}

$("homeBtn").onclick=function(){homeMode=true;current=null;lastRenderedId=null;renderNav();renderSheet();window.scrollTo(0,0);};
$("search").addEventListener("input",function(e){

  // repainted too. Only on home: repainting an open question mid-keystroke

async function fromFiles(){
  try{
    var m=await fetch("data/manifest.json",{cache:"no-store"});
    if(!m.ok) return null;
    var man=await m.json();
    var tr=await fetch("data/"+(man.taxonomy||"taxonomy.json"),{cache:"no-store"});
    if(!tr.ok) return null;
    var tax=await tr.json(),qs=[],names=[];
    Object.keys(man.papers||{}).forEach(function(p){(man.papers[p]||[]).forEach(function(f){names.push(f);});});
    /* These are independent shards. Waiting for all 70 one by one made the
       deployed page look empty for tens of seconds on GitHub Pages. Browser
       connection limits still provide natural throttling while Promise.all
       lets available slots work concurrently. A broken shard is recorded and
       skipped so the rest of the bank remains usable. */
    var parts=await Promise.all(names.map(async function(name){
      try{
        var r=await fetch("data/"+name,{cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        var arr=await r.json();
        if(!Array.isArray(arr)) throw new Error("not a question array");
        return {name:name,questions:arr};
      }catch(e){ return {name:name,error:(e&&e.message)||String(e)}; }
    }));
    var failed=[];
    parts.forEach(function(part){
      if(part.error) failed.push(part.name+" — "+part.error);
      else qs=qs.concat(part.questions);
    });
    if(!qs.length&&failed.length) return null;
    return {schemaVersion:man.schemaVersion||1,taxonomy:tax,questions:qs,failedFiles:failed};
  }catch(e){return null;}
}
async function loadPrompts(){
  try{var r=await fetch("data/prompts.json",{cache:"no-store"});if(r.ok) prompts=await r.json();}catch(e){}
}
(async function(){
  ghLoad(); useLoad();
  /* Paint before the first network wait. Previously the untouched empty sheet
     was indistinguishable from a bank with no questions. */
  $("tree").innerHTML='<p class="ph">Loading question bank…</p>';
  $("sheet").innerHTML='<div class="home"><div class="homehead"><h2>Loading questions…</h2></div>'+
    '<p class="ph">Fetching the latest taxonomy and question files.</p></div>';
  var startup=await Promise.all([fromFiles(),store.read(),loadPrompts()]);
  var files=startup[0],stored=startup[1];
  var loadFailures=(files&&files.failedFiles)||[];
  if(files) delete files.failedFiles;

  // A stored draft only counts when it is DIRTY. A clean one is a stale mirror of files we have
  // just re-read, and letting it overwrite them is how a hand-edit or a git pull used to vanish.
  var draft=(stored&&stored.dirty&&stored.db&&(stored.db.questions||[]).length)?stored.db:null;

  if(files){
    db=files;srcLabel="repo"+(loadFailures.length?(" · "+loadFailures.length+" file"+
      (loadFailures.length===1?"":"s")+" unavailable"):"");
    /* Baseline for "what changed". Without it lastSaved stays null until the
       first in-app commit, so changedFiles() falls back to "everything" and
       Save lists all 70 data files whether or not one byte differs — which
       buries the one file you actually touched. Snapshot BEFORE the draft is
       merged, so the comparison is against the repo and draft edits show up.
       Normalise first: normalizeQ fills in missing fields the moment a question
       is rendered, so a baseline taken before it would show files as changed
       just because you opened something. */
    db.questions.forEach(normalizeQ);
    lastSaved={};
    buildFiles().forEach(function(f){ lastSaved[f.path]=f.text; });
    if(draft){
      // Index by id, and APPEND rather than unshift. Unshifting mid-loop shifted every
      // element by one and invalidated every index already recorded, so the next "replace"
      // wrote over an innocent question and left the intended one behind as a duplicate —
      // it both duplicated and silently destroyed. Appending keeps every index valid.
      var have={},extra=0;
      db.questions.forEach(function(q,i){have[q.id]=i;});
      draft.questions.forEach(function(q){
        if(have[q.id]!==undefined){ db.questions[have[q.id]]=q; }
        else { have[q.id]=db.questions.length; db.questions.push(q); extra++; }
      });
      Object.keys(draft.taxonomy||{}).forEach(function(p){
        db.taxonomy[p]=db.taxonomy[p]||{};
        Object.keys(draft.taxonomy[p]).forEach(function(t){
          db.taxonomy[p][t]=db.taxonomy[p][t]||[];
          draft.taxonomy[p][t].forEach(function(x){if(db.taxonomy[p][t].indexOf(x)<0) db.taxonomy[p][t].push(x);});
        });
      });
      dirty=true;srcLabel="repo + "+extra+" new";
    }
  } else if(draft){ db=draft;dirty=true;srcLabel="draft only"; }
  else { db=JSON.parse($("seed").textContent);srcLabel="seed";await store.write(db,false); }

  db.taxonomy=db.taxonomy||{};db.questions=db.questions||[];
  // Safety net: a duplicate id means something upstream went wrong. Keep the first,
  // report the rest, rather than carrying a corrupt bank forward silently.
  (function(){
    var seen={},dups=[],keep=[];
    db.questions.forEach(function(q){
      if(seen[q.id]){dups.push(q.id);return;}
      seen[q.id]=1;keep.push(q);
    });
    if(dups.length){
      db.questions=keep;
      setTimeout(function(){toast("Dropped "+dups.length+" duplicate question"+(dups.length===1?"":"s")+" on load — save to clean the files.");},800);
    }
  })();
  if(ghReady()){
    try{ baseSha=await ghHeadSha(); }
    catch(e){ toast("GitHub is configured but unreachable — you can still edit; saving will retry."); }
  }
  syncBadge();
  current=null;homeMode=true;
  renderFilters();renderNav();renderSheet();
  if(loadFailures.length)
    toast("Loaded the available questions; "+loadFailures.length+" data file"+
      (loadFailures.length===1?" was":"s were")+" unavailable.");
})();
})();
</script>
