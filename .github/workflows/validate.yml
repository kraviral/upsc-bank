name: Validate bank

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/draft-journal.test.js
      - run: node tests/data-validation.test.js
      - run: node tests/html-smoke.test.js
